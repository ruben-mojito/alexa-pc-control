version: '3.9'

services:
  server:
    build: ./server
    container_name: alexa-pc-control-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      JWT_SECRET: '${JWT_SECRET:-change-me-in-production}'
      API_KEY: '${API_KEY:-change-me-in-production}'
      TOKEN_EXPIRY: '${TOKEN_EXPIRY:-1h}'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  wol-service:
    build: ./wol-service
    container_name: alexa-pc-control-wol
    restart: unless-stopped
    network_mode: host  # Required for UDP broadcast to reach the LAN
    environment:
      PORT: '3001'
      JWT_SECRET: '${JWT_SECRET:-change-me-in-production}'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
