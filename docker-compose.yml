version: '3.9'

services:
  server:
    build: ./server
    container_name: alexa-pc-control-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      JWT_SECRET: '${JWT_SECRET:-change-me-in-production}'
      API_KEY: '${API_KEY:-change-me-in-production}'
      TOKEN_EXPIRY: '${TOKEN_EXPIRY:-1h}'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  skill:
    build: ./alexa-skill/http-server
    container_name: alexa-pc-control-skill
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      SERVER_URL: 'http://server:3000'
      API_KEY: '${API_KEY:-change-me-in-production}'
      DEVICES: '${DEVICES:-}'
      DEFAULT_DEVICE_ID: '${DEFAULT_DEVICE_ID:-my-pc}'
      DEFAULT_DEVICE_NAME: '${DEFAULT_DEVICE_NAME:-My PC}'
      DEFAULT_MAC: '${DEFAULT_MAC:-}'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
